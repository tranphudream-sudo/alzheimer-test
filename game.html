<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Games</title>
    <link rel="stylesheet" href="game.css">
    <script src="game.js" defer></script>
</head>

<body>
    <div id="msgArea" class="msg">
        <p class="msgText"></p>
    </div>
    <div class="game">
        <div class="controls">
            <button id="btn" class="">Bắt đầu!</button>
            <div class="stats">
                <div class="moves">0 lượt đi</div>
                <div class="timer">Thời gian: 0 giây</div>
            </div>
        </div>
        <div class="board-container">
            <div class="board" data-dimension="4"></div>
            <div class="win">Bạn thắng!</div>
        </div>
        <div class="footer"><a>By LesAmis</a></div>
    </div>
</body>

</html>
